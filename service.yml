apiVersion: v1
kind: Service
metadata:
  name: unifi-service
  namespace: unifi
spec:
  selector:
    app: unifi-network-server
  type: ClusterIP
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8443

---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: unifi-gateway
  namespace: unifi
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: awx-server-certs
    hosts:
    - unifi.punkhardcore.local

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: unifi-virtualservice
  namespace: unifi
spec:
  hosts:
  - unifi.punkhardcore.local
  gateways:
  - unifi-gateway
  http:
  - route:
    - destination:
        host: unifi-service
        port:
          number: 443

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: unifi-tls-origination
  namespace: unifi
spec:
  host: unifi-service
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true

---
